<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BrandPilot AI - Personal Brand Marketing Engine</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Alpine.js for State Management -->
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
  
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['Outfit', 'sans-serif'],
          }
        }
      }
    }
  </script>

  <style>
    body {
      font-family: 'Outfit', sans-serif;
    }
    .glass-panel {
      background: rgba(255, 255, 255, 0.03);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.06);
    }
    .dark .glass-panel {
      background: rgba(0, 0, 0, 0.2);
      border: 1px solid rgba(255, 255, 255, 0.05);
    }
    .glass-heavy {
      background: rgba(10, 10, 12, 0.85);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      border: 1px solid rgba(255, 255, 255, 0.08);
    }
    @keyframes gradient-move {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }
    .animate-gradient-text {
      background-size: 200% auto;
      animation: gradient-move 6s linear infinite;
    }
    .no-scrollbar::-webkit-scrollbar {
      display: none;
    }
    .no-scrollbar {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }
  </style>
</head>
<body x-data="{ 
  currentPage: 'landing', 
  theme: 'dark',
  chatbotOpen: false,
  notificationOpen: false,
  profileMenuOpen: false,
  user: { 
    name: 'Alex Mercer', 
    profession: 'AI Solutions Architect', 
    industry: 'Technology / AI',
    goals: 'Build audience, establish thought leadership',
    bio: 'Building developer tools in public. Explaining LLMs, AI agents, and production architectures simply.',
    brandScore: 82 
  },
  editProfileMode: false,
  editName: 'Alex Mercer',
  editProfession: 'AI Solutions Architect',
  editIndustry: 'Technology / AI',
  editGoals: 'Build audience, establish thought leadership',
  editBio: 'Building developer tools in public. Explaining LLMs, AI agents, and production architectures simply.',
  notifications: [
    { id: 1, title: 'AI Assistant', message: 'Content generated successfully.', unread: true },
    { id: 2, title: 'Scheduler', message: 'Post scheduled successfully.', unread: true },
    { id: 3, title: 'User Profile', message: 'Profile updated.', unread: false },
    { id: 4, title: 'Strategy Diagnostics', message: 'Weekly report available.', unread: false }
  ],
  chatMessages: [
    { role: 'assistant', content: 'Hello! I am your BrandPilot AI assistant. Ask me to write posts, optimize tags, or brainstorm strategy ideas!' }
  ],
  chatInput: '',
  posts: [
    { id: 1, platform: 'linkedin', body: 'The future of software is agentic. We are moving from chatbots that answer questions to autonomous agents that execute multi-step workflows. Are you ready?', status: 'PUBLISHED', date: 'Yesterday, 4:00 PM' },
    { id: 2, platform: 'x', body: 'Building in public is a cheat code for growth. 1/ You get instant validation. 2/ Users feel like co-founders. 3/ Distribution is set early.', status: 'SCHEDULED', date: 'Tomorrow, 9:00 AM' }
  ],
  events: [
    { id: 1, title: 'BrandPilot AI Tool Launch', type: 'launch', desc: 'ProductHunt release.', date: '2026-07-09', suggestedIdea: 'Write a high-energy post explaining the problem we solve, our founding story, and link to the launch.' },
    { id: 2, title: 'Webinar: Agentic Workflows', type: 'webinar', desc: 'Hands-on demo of LangGraph.', date: '2026-07-12', suggestedIdea: 'Post a teaser video or code snippet showing the multi-agent graph architecture.' }
  ]
}" :class="theme">

  <div class="min-h-screen bg-zinc-950 text-zinc-100 flex flex-col font-sans transition-colors duration-300">
    
    <!-- ==================== LANDING PAGE ==================== -->
    <template x-if="currentPage === 'landing'">
      <div class="flex-1 flex flex-col">
        <!-- Header -->
        <header class="sticky top-0 z-50 glass-heavy border-b border-zinc-900 px-6 md:px-12 py-4 flex items-center justify-between">
          <div class="flex items-center gap-3">
            <div class="p-2 rounded-xl bg-gradient-to-tr from-violet-600 to-indigo-600 shadow-lg shadow-violet-500/20">
              <i data-lucide="compass" class="text-white w-5 h-5"></i>
            </div>
            <span class="font-extrabold text-lg tracking-tight bg-gradient-to-r from-white to-zinc-400 bg-clip-text text-transparent">
              BrandPilot AI
            </span>
          </div>
          <div class="flex items-center gap-3">
            <button @click="currentPage = 'login'" class="text-xs font-semibold px-4 py-2 hover:text-white text-zinc-300 transition-colors">Sign In</button>
            <button @click="currentPage = 'register'" class="text-xs font-semibold px-4 py-2.5 rounded-xl bg-violet-600 hover:bg-violet-500 text-white shadow-lg shadow-violet-500/15 transition-all">Get Started</button>
          </div>
        </header>

        <!-- Hero Section -->
        <main class="flex-1 max-w-6xl mx-auto px-6 py-16 text-center flex flex-col items-center justify-center relative">
          <div class="absolute top-10 left-1/2 -translate-x-1/2 w-[400px] h-[400px] bg-violet-600/10 rounded-full blur-[100px] pointer-events-none"></div>
          
          <div class="inline-flex items-center gap-1.5 px-3 py-1.5 rounded-full bg-violet-950/40 border border-violet-800/60 text-xs text-violet-300 font-semibold mb-8">
            <i data-lucide="sparkles" class="w-3.5 h-3.5"></i>
            <span>AI-Powered Personal Brand Growth</span>
          </div>

          <h1 class="text-4xl sm:text-6xl font-black tracking-tight leading-[1.1] max-w-4xl">
            Build Your Personal Brand <br>
            <span class="bg-gradient-to-r from-violet-400 via-fuchsia-400 to-indigo-400 bg-clip-text text-transparent animate-gradient-text">
              with Autopilot AI
            </span>
          </h1>

          <p class="text-zinc-400 text-sm sm:text-base max-w-xl mt-6 leading-relaxed">
            Optimize your industry niche, draft platform-tailored posts, plan launches with smart calendars, and scale your audience reach with automated intelligence.
          </p>

          <div class="flex flex-col sm:flex-row gap-4 mt-10 w-full sm:w-auto">
            <button @click="currentPage = 'register'" class="px-8 py-4 rounded-xl bg-gradient-to-r from-violet-600 to-indigo-600 hover:from-violet-500 hover:to-indigo-500 text-white font-bold text-xs shadow-lg shadow-violet-500/20 transition-all flex items-center justify-center gap-1">
              <span>Start Free Trial</span>
              <i data-lucide="chevron-right" class="w-4 h-4"></i>
            </button>
            <button @click="currentPage = 'login'" class="px-8 py-4 rounded-xl bg-zinc-900 border border-zinc-800 hover:bg-zinc-800 text-zinc-300 font-bold text-xs transition-colors">
              Access Demo Environment
            </button>
          </div>
        </main>
      </div>
    </template>

    <!-- ==================== LOGIN ==================== -->
    <template x-if="currentPage === 'login'">
      <div class="flex-1 flex items-center justify-center px-4 py-12 relative">
        <div class="w-full max-w-md rounded-2xl glass-heavy p-8 border border-zinc-800 shadow-2xl relative z-10">
          <div class="flex flex-col items-center mb-8">
            <div class="p-3 rounded-2xl bg-gradient-to-tr from-violet-600 to-indigo-600 w-fit mb-3">
              <i data-lucide="compass" class="w-6 h-6 text-white"></i>
            </div>
            <h2 class="font-bold text-xl text-white">Welcome back</h2>
            <p class="text-zinc-500 text-xs mt-1">Sign in to your brand pilot dashboard</p>
          </div>

          <form @submit.prevent="currentPage = 'dashboard'" class="space-y-4">
            <div>
              <label class="block text-zinc-400 text-[10px] font-bold uppercase tracking-wider mb-2">Email Address</label>
              <input type="email" placeholder="you@example.com" required class="w-full bg-zinc-900 border border-zinc-850 rounded-xl py-3 px-4 text-xs text-white focus:outline-none focus:border-violet-500 placeholder-zinc-700">
            </div>
            <div>
              <label class="block text-zinc-400 text-[10px] font-bold uppercase tracking-wider mb-2">Password</label>
              <input type="password" placeholder="••••••••" required class="w-full bg-zinc-900 border border-zinc-850 rounded-xl py-3 px-4 text-xs text-white focus:outline-none focus:border-violet-500 placeholder-zinc-700">
            </div>
            <button type="submit" class="w-full py-3.5 rounded-xl bg-violet-600 hover:bg-violet-500 text-white font-bold text-xs transition-colors">
              Sign In
            </button>
          </form>

          <div class="relative my-6">
            <div class="absolute inset-0 flex items-center"><div class="w-full border-t border-zinc-900"></div></div>
            <div class="relative flex justify-center text-[10px] uppercase font-bold tracking-widest"><span class="bg-zinc-950 px-3 text-zinc-500">Or</span></div>
          </div>

          <button @click="currentPage = 'dashboard'" class="w-full py-3.5 rounded-xl bg-zinc-900 border border-zinc-850 hover:bg-zinc-800 text-zinc-300 font-bold text-xs transition-colors">
            Access Demo Studio
          </button>
        </div>
      </div>
    </template>

    <!-- ==================== REGISTER ==================== -->
    <template x-if="currentPage === 'register'">
      <div class="flex-1 flex items-center justify-center px-4 py-12 relative">
        <div class="w-full max-w-md rounded-2xl glass-heavy p-8 border border-zinc-800 shadow-2xl relative z-10">
          <div class="flex flex-col items-center mb-6">
            <div class="p-3 rounded-2xl bg-gradient-to-tr from-violet-600 to-indigo-600 w-fit mb-3">
              <i data-lucide="compass" class="w-6 h-6 text-white"></i>
            </div>
            <h2 class="font-bold text-xl text-white">Create Account</h2>
            <p class="text-zinc-500 text-xs mt-1">Begin building your AI strategy wizard</p>
          </div>

          <form @submit.prevent="currentPage = 'onboarding'" class="space-y-4">
            <div>
              <label class="block text-zinc-400 text-[10px] font-bold uppercase tracking-wider mb-2">Name</label>
              <input type="text" placeholder="Alex Mercer" required class="w-full bg-zinc-900 border border-zinc-850 rounded-xl py-3 px-4 text-xs text-white focus:outline-none focus:border-violet-500 placeholder-zinc-700">
            </div>
            <div>
              <label class="block text-zinc-400 text-[10px] font-bold uppercase tracking-wider mb-2">Email</label>
              <input type="email" placeholder="you@example.com" required class="w-full bg-zinc-900 border border-zinc-850 rounded-xl py-3 px-4 text-xs text-white focus:outline-none focus:border-violet-500 placeholder-zinc-700">
            </div>
            <div>
              <label class="block text-zinc-400 text-[10px] font-bold uppercase tracking-wider mb-2">Password</label>
              <input type="password" placeholder="••••••••" required class="w-full bg-zinc-900 border border-zinc-850 rounded-xl py-3 px-4 text-xs text-white focus:outline-none focus:border-violet-500 placeholder-zinc-700">
            </div>
            <button type="submit" class="w-full py-3.5 rounded-xl bg-violet-600 hover:bg-violet-500 text-white font-bold text-xs transition-colors">
              Continue to Onboarding
            </button>
          </form>
        </div>
      </div>
    </template>

    <!-- ==================== ONBOARDING ==================== -->
    <template x-if="currentPage === 'onboarding'">
      <div class="flex-1 flex items-center justify-center px-4 py-12 relative" x-data="{ onStep: 1 }">
        <div class="w-full max-w-lg rounded-2xl glass-heavy p-8 border border-zinc-800 shadow-2xl relative z-10">
          
          <div class="flex justify-between items-center mb-6">
            <span class="text-[10px] uppercase font-bold text-violet-400">Step <span x-text="onStep"></span> of 3</span>
            <div class="flex gap-1">
              <div class="w-6 h-1 rounded bg-violet-600"></div>
              <div class="w-6 h-1 rounded" :class="onStep >= 2 ? 'bg-violet-600' : 'bg-zinc-800'"></div>
              <div class="w-6 h-1 rounded" :class="onStep >= 3 ? 'bg-violet-600' : 'bg-zinc-800'"></div>
            </div>
          </div>

          <div x-show="onStep === 1" class="space-y-4">
            <h3 class="font-bold text-lg text-white">What is your professional focus?</h3>
            <div>
              <label class="block text-zinc-400 text-[10px] font-bold uppercase tracking-wider mb-2">Profession</label>
              <input type="text" placeholder="e.g. AI Consultant, Tech Writer" class="w-full bg-zinc-900 border border-zinc-850 rounded-xl py-3 px-4 text-xs text-white focus:outline-none">
            </div>
            <div>
              <label class="block text-zinc-400 text-[10px] font-bold uppercase tracking-wider mb-2">Industry Niche</label>
              <input type="text" placeholder="e.g. Generative AI tools, remote product design" class="w-full bg-zinc-900 border border-zinc-850 rounded-xl py-3 px-4 text-xs text-white focus:outline-none">
            </div>
            <button @click="onStep = 2" class="w-full py-3.5 rounded-xl bg-violet-600 hover:bg-violet-500 text-white font-bold text-xs transition-colors">Continue</button>
          </div>

          <div x-show="onStep === 2" class="space-y-4">
            <h3 class="font-bold text-lg text-white">Who is your target audience?</h3>
            <div>
              <label class="block text-zinc-400 text-[10px] font-bold uppercase tracking-wider mb-2">Audience Persona</label>
              <input type="text" placeholder="e.g. CTOs, Junior developers, VC founders" class="w-full bg-zinc-900 border border-zinc-850 rounded-xl py-3 px-4 text-xs text-white focus:outline-none">
            </div>
            <div>
              <label class="block text-zinc-400 text-[10px] font-bold uppercase tracking-wider mb-2">Publish Channels</label>
              <div class="flex gap-2">
                <button class="px-3 py-2 rounded-xl bg-zinc-900 border border-zinc-800 text-xs">LinkedIn</button>
                <button class="px-3 py-2 rounded-xl bg-zinc-900 border border-zinc-800 text-xs">X / Twitter</button>
                <button class="px-3 py-2 rounded-xl bg-zinc-900 border border-zinc-800 text-xs">YouTube</button>
              </div>
            </div>
            <div class="flex gap-2">
              <button @click="onStep = 1" class="flex-1 py-3 bg-zinc-900 text-zinc-300 rounded-xl border border-zinc-800 text-xs">Back</button>
              <button @click="onStep = 3" class="flex-1 py-3 bg-violet-600 hover:bg-violet-500 text-white rounded-xl text-xs font-bold">Continue</button>
            </div>
          </div>

          <div x-show="onStep === 3" class="space-y-4">
            <h3 class="font-bold text-lg text-white">Select content style</h3>
            <div>
              <label class="block text-zinc-400 text-[10px] font-bold uppercase tracking-wider mb-2">Tone of Voice</label>
              <select class="w-full bg-zinc-900 border border-zinc-850 rounded-xl py-3 px-3 text-xs text-white focus:outline-none">
                <option>Professional / Educational</option>
                <option>Witty / Conversational</option>
                <option>Bold / Disruptive</option>
              </select>
            </div>
            <div class="flex gap-2">
              <button @click="onStep = 2" class="flex-1 py-3 bg-zinc-900 text-zinc-300 rounded-xl border border-zinc-800 text-xs">Back</button>
              <button @click="currentPage = 'dashboard'" class="flex-1 py-3 bg-violet-600 hover:bg-violet-500 text-white rounded-xl text-xs font-bold">Analyze & Launch Studio</button>
            </div>
          </div>

        </div>
      </div>
    </template>

    <!-- ==================== DASHBOARD SHELL ==================== -->
    <template x-if="currentPage === 'dashboard' || currentPage === 'profile' || currentPage === 'generator' || currentPage === 'calendar' || currentPage === 'analytics' || currentPage === 'strategy' || currentPage === 'settings' || currentPage === 'admin'">
      <div class="flex-1 flex min-h-screen">
        
        <!-- Sidebar Navigation -->
        <aside class="hidden md:flex flex-col w-64 glass-panel border-r border-zinc-900 p-5 justify-between">
          <div class="space-y-8">
            <div class="flex items-center gap-3 py-2">
              <div class="p-2 rounded-xl bg-gradient-to-tr from-violet-600 to-indigo-600">
                <i data-lucide="compass" class="text-white w-5 h-5"></i>
              </div>
              <span class="font-extrabold text-sm tracking-tight text-white">BrandPilot AI</span>
            </div>

            <nav class="space-y-1.5 text-xs font-semibold">
              <button @click="currentPage = 'dashboard'" :class="currentPage === 'dashboard' ? 'bg-violet-950/20 text-white border-l-2 border-violet-500' : 'text-zinc-400 hover:text-white'" class="w-full flex items-center gap-3 px-4 py-3 rounded-xl transition-all">
                <i data-lucide="layout-dashboard" class="w-4 h-4"></i>
                <span>Dashboard</span>
              </button>
              <button @click="currentPage = 'profile'" :class="currentPage === 'profile' ? 'bg-violet-950/20 text-white border-l-2 border-violet-500' : 'text-zinc-400 hover:text-white'" class="w-full flex items-center gap-3 px-4 py-3 rounded-xl transition-all">
                <i data-lucide="user" class="w-4 h-4"></i>
                <span>Profile Card</span>
              </button>
              <button @click="currentPage = 'generator'" :class="currentPage === 'generator' ? 'bg-violet-950/20 text-white border-l-2 border-violet-500' : 'text-zinc-400 hover:text-white'" class="w-full flex items-center gap-3 px-4 py-3 rounded-xl transition-all">
                <i data-lucide="sparkles" class="w-4 h-4"></i>
                <span>AI Generator</span>
              </button>
              <button @click="currentPage = 'calendar'" :class="currentPage === 'calendar' ? 'bg-violet-950/20 text-white border-l-2 border-violet-500' : 'text-zinc-400 hover:text-white'" class="w-full flex items-center gap-3 px-4 py-3 rounded-xl transition-all">
                <i data-lucide="calendar" class="w-4 h-4"></i>
                <span>Calendar Planner</span>
              </button>
              <button @click="currentPage = 'analytics'" :class="currentPage === 'analytics' ? 'bg-violet-950/20 text-white border-l-2 border-violet-500' : 'text-zinc-400 hover:text-white'" class="w-full flex items-center gap-3 px-4 py-3 rounded-xl transition-all">
                <i data-lucide="bar-chart-3" class="w-4 h-4"></i>
                <span>Engagement Analytics</span>
              </button>
              <button @click="currentPage = 'strategy'" :class="currentPage === 'strategy' ? 'bg-violet-950/20 text-white border-l-2 border-violet-500' : 'text-zinc-400 hover:text-white'" class="w-full flex items-center gap-3 px-4 py-3 rounded-xl transition-all">
                <i data-lucide="trending-up" class="w-4 h-4"></i>
                <span>Growth Strategy</span>
              </button>
              <button @click="currentPage = 'settings'" :class="currentPage === 'settings' ? 'bg-violet-950/20 text-white border-l-2 border-violet-500' : 'text-zinc-400 hover:text-white'" class="w-full flex items-center gap-3 px-4 py-3 rounded-xl transition-all">
                <i data-lucide="settings" class="w-4 h-4"></i>
                <span>Settings</span>
              </button>
              <button @click="currentPage = 'admin'" :class="currentPage === 'admin' ? 'bg-violet-950/20 text-white border-l-2 border-violet-500' : 'text-zinc-400 hover:text-white'" class="w-full flex items-center gap-3 px-4 py-3 rounded-xl transition-all">
                <i data-lucide="user-cog" class="w-4 h-4"></i>
                <span>Admin Panel</span>
              </button>
            </nav>
          </div>

          <button @click="currentPage = 'landing'" class="flex items-center gap-3 px-4 py-3 text-xs font-semibold text-rose-400 hover:bg-rose-950/20 rounded-xl transition-colors">
            <i data-lucide="log-out" class="w-4 h-4"></i>
            <span>Log Out</span>
          </button>
        </aside>

        <!-- Main Work Area -->
        <div class="flex-1 flex flex-col min-w-0">
          <!-- Topbar Header -->
          <header class="h-16 border-b border-zinc-900 px-6 flex items-center justify-between glass-heavy">
            <h2 class="text-xs font-bold text-zinc-400 hidden sm:block">
              Welcome back, <span class="text-violet-400" x-text="user.name"></span>
            </h2>

            <div class="flex items-center gap-4 ml-auto">
              <!-- Quick Gen -->
              <button @click="currentPage = 'generator'" class="flex items-center gap-1 px-3 py-1.5 rounded-lg bg-gradient-to-r from-violet-600 to-indigo-600 text-white font-bold text-[10px] transition-all hover:scale-105">
                <i data-lucide="sparkles" class="w-3.5 h-3.5"></i>
                <span>Quick Gen</span>
              </button>

              <!-- Notifications Dropdown -->
              <div class="relative">
                <button @click="notificationOpen = !notificationOpen" class="p-2 border border-zinc-800 rounded-lg text-zinc-400 hover:text-white relative">
                  <i data-lucide="bell" class="w-4 h-4"></i>
                  <span class="absolute top-1.5 right-1.5 w-1.5 h-1.5 rounded-full bg-violet-600"></span>
                </button>
                <div x-show="notificationOpen" @click.away="notificationOpen = false" class="absolute right-0 mt-2 w-72 rounded-xl bg-zinc-950 border border-zinc-850 p-4 shadow-2xl z-50 text-xs">
                  <h4 class="font-bold border-b border-zinc-900 pb-2 text-[10px] uppercase tracking-wider text-zinc-400">Notifications</h4>
                  <div class="mt-2 space-y-2">
                    <template x-for="not in notifications" :key="not.id">
                      <div class="p-2.5 rounded-xl bg-zinc-900/60 border border-zinc-850">
                        <span class="font-bold block text-zinc-200" x-text="not.title"></span>
                        <p class="text-[10px] text-zinc-500 mt-0.5" x-text="not.message"></p>
                      </div>
                    </template>
                  </div>
                </div>
              </div>

              <!-- Profile Dropdown -->
              <div class="relative">
                <button @click="profileMenuOpen = !profileMenuOpen" class="w-8 h-8 rounded-full bg-violet-600 flex items-center justify-center font-bold text-xs text-white">
                  AM
                </button>
                <div x-show="profileMenuOpen" @click.away="profileMenuOpen = false" class="absolute right-0 mt-2 w-48 rounded-xl bg-zinc-950 border border-zinc-855 p-2 shadow-2xl z-50 text-xs flex flex-col gap-1">
                  <button @click="currentPage = 'profile'; profileMenuOpen = false;" class="w-full text-left px-3 py-2 rounded-lg hover:bg-zinc-900 text-zinc-300">My Profile Card</button>
                  <button @click="currentPage = 'settings'; profileMenuOpen = false;" class="w-full text-left px-3 py-2 rounded-lg hover:bg-zinc-900 text-zinc-300">System Settings</button>
                  <button @click="currentPage = 'admin'; profileMenuOpen = false;" class="w-full text-left px-3 py-2 rounded-lg hover:bg-zinc-900 text-zinc-300">Admin Panel</button>
                </div>
              </div>
            </div>
          </header>

          <!-- Workspace routing container -->
          <main class="flex-1 p-6 md:p-8 bg-zinc-950 overflow-y-auto no-scrollbar">
            
            <!-- ===== VIEW: DASHBOARD ===== -->
            <div x-show="currentPage === 'dashboard'" class="space-y-8 animate-in fade-in duration-300">
              <div>

            <!-- ===== VIEW: STRATEGY ===== -->
            <div x-show="currentPage === 'strategy'" class="space-y-8 animate-in fade-in duration-300">
              <h1 class="text-2xl font-bold text-white">AI Strategy Recommendations</h1>
              <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                <!-- Card 1 -->
                <div class="p-6 rounded-2xl glass-panel space-y-3">
                  <span class="font-bold text-zinc-400 uppercase tracking-widest text-[9px] block">Weekly Recommendation</span>
                  <p class="text-xs text-zinc-350 leading-relaxed">Focus on detailed 'how-to' carousel guides for LinkedIn. Share bite-sized technical tips weekly.</p>
                </div>
                <!-- Card 2 -->
                <div class="p-6 rounded-2xl glass-panel space-y-3">
                  <span class="font-bold text-zinc-400 uppercase tracking-widest text-[9px] block">Best Posting Time</span>
                  <p class="text-xs text-zinc-355 leading-relaxed">LinkedIn: Tue 8:30 AM | X: Wed 12:00 PM. Schedule content slots peak windows.</p>
                </div>
                <!-- Card 3 -->
                <div class="p-6 rounded-2xl glass-panel space-y-3">
                  <span class="font-bold text-zinc-400 uppercase tracking-widest text-[9px] block">Content Suggestion</span>
                  <p class="text-xs text-zinc-350 leading-relaxed">Generate 3-part threads breaking down recent software launch failures. Use code blocks.</p>
                </div>
                <!-- Card 4 -->
                <div class="p-6 rounded-2xl glass-panel space-y-3">
                  <span class="font-bold text-zinc-400 uppercase tracking-widest text-[9px] block">Audience Insight</span>
                  <p class="text-xs text-zinc-350 leading-relaxed">CTOs and senior developers commented on your post. Technical insights drives high engagement rate.</p>
                </div>
                <!-- Card 5 -->
                <div class="p-6 rounded-2xl glass-panel space-y-3">
                  <span class="font-bold text-zinc-400 uppercase tracking-widest text-[9px] block">Next Week Goal</span>
                  <p class="text-xs text-zinc-350 leading-relaxed">Reach out to 5 creators, comment on peer topics, and maintain a 3 posts scheduling frequency.</p>
                </div>
              </div>
            </div>

            <!-- ===== VIEW: SETTINGS ===== -->
            <div x-show="currentPage === 'settings'" class="space-y-8 animate-in fade-in duration-300">
              <h1 class="text-2xl font-bold text-white">Settings</h1>
              <div class="p-6 rounded-2xl glass-panel space-y-6 max-w-lg">
                <div class="space-y-4 text-xs text-zinc-300">
                  <div class="flex justify-between items-center py-2.5 border-b border-zinc-900">
                    <div>
                      <span class="font-bold text-zinc-200 block">Dark Mode</span>
                      <span class="text-[10px] text-zinc-500 block mt-0.5">Toggle interface colors</span>
                    </div>
                    <button class="px-3 py-1.5 rounded-lg bg-zinc-900 border border-zinc-800 font-bold">Enabled</button>
                  </div>
                  <div class="flex justify-between items-center py-2.5 border-b border-zinc-900">
                    <div>
                      <span class="font-bold text-zinc-200 block">Notifications</span>
                      <span class="text-[10px] text-zinc-500 block mt-0.5">Receive email reports alerts</span>
                    </div>
                    <button class="px-3 py-1.5 rounded-lg bg-zinc-900 border border-zinc-800 font-bold">Active</button>
                  </div>
                  <div class="flex justify-between items-center py-2.5 border-b border-zinc-900">
                    <div>
                      <span class="font-bold text-zinc-200 block">Language</span>
                      <span class="text-[10px] text-zinc-500 block mt-0.5">Primary system interface language</span>
                    </div>
                    <select class="bg-zinc-900 border border-zinc-800 py-1.5 px-2.5 rounded-lg focus:outline-none"><option>English (US)</option></select>
                  </div>
                </div>

                <div class="pt-4 border-t border-rose-900/30">
                  <button @click="currentPage = 'landing'; notifications.unshift({ id: Date.now(), title: 'System Alerts', message: 'Account deleted successfully.', unread: true });" class="w-full py-3 border border-rose-900 hover:bg-rose-950/20 text-rose-450 font-bold rounded-xl transition-all">Delete Account</button>
                </div>
              </div>
            </div>

            <!-- ===== VIEW: ADMIN ===== -->
            <div x-show="currentPage === 'admin'" class="space-y-8 animate-in fade-in duration-300">
              <h1 class="text-2xl font-bold text-white font-sans">Admin Control Center</h1>
              <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
                <div class="p-4 rounded-xl bg-zinc-900 border border-zinc-800 text-xs">
                  <span class="text-zinc-550 block font-semibold">API Gateway Status</span>
                  <span class="font-bold text-emerald-400 block mt-1">Healthy (42ms)</span>
                </div>
                <div class="p-4 rounded-xl bg-zinc-900 border border-zinc-800 text-xs">
                  <span class="text-zinc-550 block font-semibold">Database Nodes</span>
                  <span class="font-bold text-emerald-400 block mt-1">Connected (3ms)</span>
                </div>
                <div class="p-4 rounded-xl bg-zinc-900 border border-zinc-800 text-xs">
                  <span class="text-zinc-550 block font-semibold">System Queue</span>
                  <span class="font-bold text-emerald-400 block mt-1">Optimal</span>
                </div>
              </div>
            </div>

          </main>
        </div>
      </div>
    </template>

    <!-- ==================== FLOATING AI COACH ASSISTANT ==================== -->
    <div class="fixed bottom-6 right-6 z-50">
      <button @click="chatbotOpen = !chatbotOpen" class="flex items-center justify-center p-4 rounded-full bg-gradient-to-tr from-violet-600 to-indigo-600 text-white shadow-xl shadow-violet-500/20 hover:scale-105 transition-all">
        <i data-lucide="message-square" class="w-6 h-6"></i>
      </button>

      <div x-show="chatbotOpen" class="fixed bottom-24 right-6 w-80 h-96 rounded-2xl glass-heavy border border-zinc-800 shadow-2xl flex flex-col overflow-hidden animate-in fade-in slide-in-from-bottom-5">
        <div class="bg-zinc-950 px-4 py-3 border-b border-zinc-900 flex justify-between items-center">
          <span class="font-bold text-xs text-white flex items-center gap-1.5">
            <i data-lucide="bot" class="w-4 h-4 text-violet-400"></i>
            BrandPilot Strategy Coach
          </span>
          <button @click="chatbotOpen = false" class="text-zinc-550 hover:text-white"><i data-lucide="x" class="w-4 h-4"></i></button>
        </div>

        <div class="flex-1 p-3 overflow-y-auto space-y-3 text-[11px] no-scrollbar">
          <template x-for="msg in chatMessages">
            <div class="flex gap-2" :class="msg.role === 'user' ? 'justify-end' : 'justify-start'">
              <div class="p-2.5 rounded-xl max-w-[80%]" :class="msg.role === 'user' ? 'bg-violet-600 text-white' : 'bg-zinc-900 border border-zinc-800 text-zinc-300'" x-text="msg.content"></div>
            </div>
          </template>
        </div>

        <form @submit.prevent="
          chatMessages.push({ role: 'user', content: chatInput });
          const userIn = chatInput.toLowerCase();
          chatInput = '';
          setTimeout(() => {
            let reply = 'I can help you build your schedule or adjust your platform tone settings. Ask me to generate content ideas!';
            if (userIn.includes('linkedin') || userIn.includes('post') || userIn.includes('idea')) {
              reply = 'Here is a custom LinkedIn framework:\n\n“Most developers fail at prompt engineering because they write long essays. Here are 3 strict rules to fix it...”';
            }
            chatMessages.push({ role: 'assistant', content: reply });
          }, 600);
        " class="p-2 border-t border-zinc-900 bg-zinc-950 flex gap-2">
          <input type="text" x-model="chatInput" placeholder="Ask coach..." class="flex-1 bg-zinc-900 border border-zinc-800 rounded-xl px-3 py-1.5 text-[11px] text-white focus:outline-none focus:border-violet-500 placeholder-zinc-650">
          <button type="submit" class="p-2 rounded-xl bg-violet-600 text-white"><i data-lucide="send" class="w-3.5 h-3.5"></i></button>
        </form>
      </div>
    </div>

  </div>

  <script>
    // Initialize Lucide Icons
    window.addEventListener('DOMContentLoaded', () => {
      lucide.createIcons();
    });
  </script>
</body>
</html>
